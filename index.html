<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Money Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #f8f9fa, #e9ecef); }
    .balance-card { background: linear-gradient(135deg, #00c853, #64dd17); color: white; }
    .income { color: #00c853; }
    .expense { color: #dc3545; }
  </style>
</head>
<body class="p-3">

  <div class="container">

    <h1 class="text-center mb-4">💰 My Expense Tracker</h1>
    <p class="display-5">💵 Spend like a pro 💪🏼</span></p>

    <!-- Balance -->
    <div class="balance-card rounded-4 p-4 text-center mb-4">
      <h6>Total Balance</h6>
      <h2 id="balance">₦0.00</h2>
    </div>

    <!-- Quick Stats -->
    <div class="row mb-4">
      <div class="col-6">
        <div class="card text-center">
          <div class="card-body">
            <h5 class="income">Income</h5>
            <h4 id="total-income" class="income">₦0</h4>
          </div>
        </div>
      </div>
      <div class="col-6">
        <div class="card text-center">
          <div class="card-body">
            <h5 class="expense">Expenses</h5>
            <h4 id="total-expense" class="expense">₦0</h4>
          </div>
        </div>
      </div>
    </div>

    <button onclick="showModal()" class="btn btn-success w-100 py-3 mb-4 fw-bold">+ Add New Transaction</button>

    <!-- Transactions -->
    <h5 class="mb-3">Recent Transactions</h5>
    <div id="transactions" class="mb-5"></div>

  </div>

  <!-- Add Transaction Modal -->
  <div class="modal fade" id="addModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">New Transaction</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <select id="type" class="form-select mb-3">
            <option value="income">Income (+)</option>
            <option value="expense">Expense (-)</option>
          </select>
          <input type="text" id="desc" class="form-control mb-3" placeholder="Description">
          <input type="number" id="amount" class="form-control mb-3" placeholder="Amount">
          <select id="category" class="form-select">
            <option value="Salary">Salary</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Data/Airtime">Data/Airtime</option>
            <option value="Betting">Betting 😅</option>
            <option value="Others">Others</option>
          </select>
        </div>
        <div class="modal-footer">
          <button onclick="addTransaction()" class="btn btn-success w-100">Save Transaction</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js">

  </script>
</body>
</html>
